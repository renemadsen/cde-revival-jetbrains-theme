name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build and Verify Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build plugin
        run: ./gradlew buildPlugin
      
      - name: Verify plugin
        run: ./gradlew verifyPlugin
      
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cde-revival-theme-plugin
          path: build/distributions/*.zip
          retention-days: 30
  
  # Optional: Automatically create a release when a tag is pushed
  release:
    name: Publish Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build plugin
        run: ./gradlew buildPlugin
      
      - name: Get plugin version
        id: get_version
        run: echo "VERSION=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/distributions/cde-revival-jetbrains-theme-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: cde-revival-jetbrains-theme-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
